
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#030817">
<title>Hans Arnold 💀👾</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;color:#e8f7ff;
 font-family:Arial,sans-serif;
 background:radial-gradient(ellipse at top,#102e66 0%,#050b1b 48%,#01030a 100%);
 display:flex;align-items:center;justify-content:center;
 padding:22px;overflow-x:hidden
}
body:before{
 content:"";position:fixed;inset:0;pointer-events:none;
 background:repeating-linear-gradient(0deg,transparent 0 3px,#168bff08 4px 5px)
}
.card{
 width:100%;max-width:440px;text-align:center;padding:34px 23px;
 border:1px solid #178cff80;border-radius:24px;
 background:#071329d9;box-shadow:0 0 30px #007bff30,inset 0 0 25px #007bff10;
 animation:appear 1s ease
}
.symbol{font-size:55px;filter:drop-shadow(0 0 12px #00aaff)}
h1{
 font-size:clamp(30px,9vw,43px);margin:15px 0 8px;
 color:#66d9ff;text-shadow:0 0 12px #008cff,0 0 28px #005dff;
 letter-spacing:2px
}
.tag{color:#91a9ce;letter-spacing:3px;font-size:11px}
.line{height:2px;background:linear-gradient(90deg,transparent,#168bff,transparent);margin:25px 0}
.status{color:#53e8ba;font-size:12px;letter-spacing:2px}
p{color:#c0d0e9;line-height:1.7;font-size:15px}
.button{
 display:block;text-decoration:none;color:white;font-weight:bold;
 padding:15px;margin-top:22px;border:1px solid #36baff;
 border-radius:12px;background:linear-gradient(100deg,#0754bd,#087fe8);
 box-shadow:0 0 20px #008cff45;transition:.25s
}
.button:active{transform:scale(.97)}
.footer{font-size:11px;color:#607ba3;margin-top:27px}
@keyframes appear{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<main class="card">
 <div class="symbol">💀👾</div>
 <h1>HANS ARNOLD</h1>
 <div class="tag">DARK WEB • DIGITAL UNIVERSE</div>
 <div class="line"></div>
 <div class="status">● SYSTEM ONLINE</div>
 <p>Bienvenue dans mon univers.<br>
 Mystère, technologie et ambiance cyberpunk.<br>
 Entrez dans mon monde numérique.</p>
 <a class="button" href="https://wa.me/2250502149783" target="_blank" rel="noopener">
   ☎ CONTACTER SUR WHATSAPP
 </a>
 <div class="footer">HANS ARNOLD © 2026<br>BLUE NEON EXPERIENCE</div>
</main>
</body>
</html>
